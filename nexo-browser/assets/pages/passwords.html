<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Пароли</title>
<style>/*THEME*/
/*PAGECSS*/
.notice { display: none; margin: 0 0 14px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--panel-border); background: var(--panel); }
.notice.show { display: block; }
.notice.err { border-color: var(--warm); background: var(--warm-bg); }
.form { padding: 16px 18px; display: grid; gap: 10px; max-width: 520px; }
.form label { display: grid; gap: 4px; color: var(--text-dim); font-size: 12.5px; }
.form input[type=text], .form input[type=password], .form textarea { width: 100%; height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--panel-border); background: var(--bg-start); color: var(--text); font: inherit; outline: none; }
.form textarea { height: 64px; padding: 8px 12px; resize: vertical; }
.form input:focus, .form textarea:focus { border-color: var(--accent-cyan); }
.form .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.form .hint, .hint { color: var(--text-dim); font-size: 12.5px; }
.pw { display: flex; gap: 8px; }
.pw input { flex: 1; }
.acts { display: flex; gap: 6px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.pwv { font-family: Consolas, monospace; color: var(--accent-cyan); user-select: text; }
.danger { color: var(--warm); border-color: var(--warm); }
[hidden] { display: none !important; }
</style></head>
<body><div class="page">
<h1><span>Nexo</span> · Пароли</h1>
<p class="sub">Хранилище шифруется мастер-паролем (AES-256, ключ из Argon2id). Блокируется само через 10 минут без действий.</p>
<div id="notice" class="notice" role="status"></div>
<div id="root"></div>
<input type="file" id="csv-file" accept=".csv,text/csv,text/plain" hidden>
</div>
<script src="page.js"></script><script src="passwords.js"></script>
</body></html>
