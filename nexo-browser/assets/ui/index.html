<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Nexo</title>
<style id="theme">/*THEME*/</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="app">
  <div class="tabstrip">
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="icon-btn new-tab" id="new-tab" title="Новая вкладка (Ctrl+T)" aria-label="Новая вкладка"></button>
  </div>
  <div class="toolbar">
    <button class="icon-btn" id="back" title="Назад (Alt+←)" aria-label="Назад" disabled></button>
    <button class="icon-btn" id="forward" title="Вперёд (Alt+→)" aria-label="Вперёд" disabled></button>
    <button class="icon-btn" id="reload" title="Обновить" aria-label="Обновить"></button>
    <form class="address" id="address-form" autocomplete="off">
      <span class="sec" id="sec"></span>
      <input id="url" type="text" spellcheck="false" placeholder="Поиск или адрес сайта" aria-label="Адресная строка">
      <button type="button" class="icon-btn star" id="star" title="В закладки (Ctrl+D)" aria-label="В закладки"></button>
    </form>
    <button class="icon-btn" id="menu" title="Настройка и управление Nexo" aria-label="Меню"></button>
  </div>
  <div class="progress" id="progress"></div>
</div>
<script src="ui.js"></script>
</body>
</html>
