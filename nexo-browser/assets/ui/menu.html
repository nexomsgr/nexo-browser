<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Меню</title>
<style>
/*THEME*/
* { box-sizing: border-box; }
html, body { margin: 0; user-select: none; -webkit-user-select: none; overflow: hidden; }
body { font: 13px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: var(--panel-hover); color: var(--text); }
#menu { padding: 6px 0; border: 1px solid var(--panel-border); border-radius: 10px; }
.item {
  display: flex; align-items: center; gap: 14px; width: 100%; height: 34px; padding: 0 16px;
  border: 0; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: default;
}
.item:hover, .item:focus-visible { background: var(--selected); outline: 0; }
.item svg { flex: none; color: var(--accent-cyan); }
.item .label { flex: 1; }
.item .hint { color: var(--text-dim); font-size: 12px; }
.item.amber svg { color: var(--warm); }
.sep { height: 1px; margin: 6px 0; background: var(--panel-border); }
.zoom { display: flex; align-items: center; gap: 14px; height: 38px; padding: 0 8px 0 16px; }
.zoom .label { flex: 1; }
.zoom button {
  width: 30px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--text);
  font: inherit; font-size: 16px; cursor: default;
}
.zoom button:hover { background: var(--selected); }
.zoom #zv { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="menu" role="menu"></div>
<script src="menu.js"></script>
</body>
</html>
